<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>טבלת ייאוש - עד מתי?!</title>
    <style>
        :root {
            --primary-gold: #d4af37;
            --accent-glow: rgba(212, 175, 55, 0.4);
            --glass-bg: rgba(255, 255, 255, 0.12);
            --glass-border: rgba(255, 255, 255, 0.25);
            --text-light: #ffffff;
            --text-sub: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-light);
            /* רקע משולב חופשה: תאילנד, כנרת ושלווה */
            background: linear-gradient(rgba(15, 23, 42, 0.45), rgba(15, 23, 42, 0.55)),
                        url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat fixed;
        }

        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 35px 25px;
            max-width: 750px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 2.4rem;
            color: var(--text-light);
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .target-date {
            font-size: 1.3rem;
            color: var(--primary-gold);
            font-weight: bold;
            margin-bottom: 25px;
            text-shadow: 0 0 12px var(--accent-glow);
        }

        /* גריד ספירה לאחור */
        .countdown-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .time-box {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 15px 5px;
            box-shadow: inset 0 0 15px rgba(255,255,255,0.05);
            backdrop-filter: blur(8px);
        }

        .time-value {
            font-size: 2.5rem;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 0 10px var(--accent-glow);
            display: block;
            line-height: 1.1;
        }

        .time-label {
            font-size: 0.9rem;
            color: var(--text-sub);
            margin-top: 5px;
        }

        /* מד התקדמות */
        .progress-container {
            margin-bottom: 25px;
        }

        .progress-title {
            font-size: 1rem;
            margin-bottom: 8px;
            color: var(--text-sub);
        }

        .progress-bar-bg {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            height: 22px;
            border-radius: 11px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar-fill {
            background: linear-gradient(90deg, #d4af37, #f59e0b);
            height: 100%;
            width: 0%;
            transition: width 0.5s ease;
            box-shadow: 0 0 15px var(--primary-gold);
        }

        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.85rem;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        /* משפט מוטיבציה / הומור */
        .quote-box {
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 12px;
            padding: 12px 20px;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 30px;
            color: #fff;
            text-shadow: 0 1px 4px rgba(0,0,0,0.6);
        }

        /* טבלת ימי ייאוש */
        .days-section-title {
            font-size: 1.1rem;
            margin-bottom: 12px;
            color: var(--text-light);
        }

        .days-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            max-height: 160px;
            overflow-y: auto;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 14px;
            border: 1px solid var(--glass-border);
        }

        .day-chip {
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: bold;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .day-chip.passed {
            background: rgba(16, 185, 129, 0.2);
            border-color: rgba(16, 185, 129, 0.4);
            color: #a7f3d0;
            text-decoration: line-through;
            opacity: 0.6;
        }

        .day-chip.today {
            background: var(--primary-gold);
            color: #000;
            border-color: #fff;
            box-shadow: 0 0 12px var(--primary-gold);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        @media (max-width: 500px) {
            h1 { font-size: 1.8rem; }
            .time-value { font-size: 1.8rem; }
            .countdown-grid { gap: 8px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>ספירה לאחור לסיום התפקיד 🕊️</h1>
        <div class="target-date">08/10/2026</div>

        <div class="countdown-grid">
            <div class="time-box">
                <span class="time-value" id="days">000</span>
                <span class="time-label">ימים</span>
            </div>
            <div class="time-box">
                <span class="time-value" id="hours">00</span>
                <span class="time-label">שעות</span>
            </div>
            <div class="time-box">
                <span class="time-value" id="minutes">00</span>
                <span class="time-label">דקות</span>
            </div>
            <div class="time-box">
                <span class="time-value" id="seconds">00</span>
                <span class="time-label">שניות</span>
            </div>
        </div>

        <div class="progress-container">
            <div class="progress-title">המסע הושלם:</div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar"></div>
                <div class="progress-text" id="progressText">0% הושלם</div>
            </div>
        </div>

        <div class="quote-box">
            עוד לא נולד המניאק שיעצור את הזמן 💪✨
        </div>

        <div class="days-section-title">הייאוש הנותר (ימים שנותרו):</div>
        <div class="days-grid" id="daysGrid"></div>
    </div>

    <script>
        // תאריך יעד: 8 באוקטובר 2026 בשעה 08:00
        const targetDate = new Date(2026, 9, 8, 8, 0, 0); // חודש 9 זה אוקטובר (0-indexed)

        // תאריך התחלה משוער לצורך חישוב אחוזים (שנה אחורה מתאריך הסיום)
        const startDate = new Date(2025, 9, 8, 8, 0, 0); 

        function updateCountdown() {
            const now = new Date();
            const timeDiff = targetDate - now;

            if (timeDiff <= 0) {
                document.querySelector('.container').innerHTML = `
                    <h1 style="font-size: 3rem;">🎉 זהו, חופשי! 🎉</h1>
                    <p style="font-size: 1.5rem; margin-top: 15px;">ברוכים הבאים לשלווה, לכנרת ולתאילנד! 🏝️🎓</p>
                `;
                return;
            }

            // חישוב ימים, שעות, דקות ושניות
            const days = Math.floor(timeDiff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((timeDiff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((timeDiff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((timeDiff % (1000 * 60)) / 1000);

            document.getElementById('days').textContent = String(days).padStart(3, '0');
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');

            // חישוב אחוז התקדמות
            const totalDuration = targetDate - startDate;
            const elapsed = now - startDate;
            let progressPercentage = Math.min(100, Math.max(0, (elapsed / totalDuration) * 100));
            
            document.getElementById('progressBar').style.width = progressPercentage + '%';
            document.getElementById('progressText').textContent = progressPercentage.toFixed(1) + '% הושלם';
        }

        function generateDaysGrid() {
            const gridContainer = document.getElementById('daysGrid');
            gridContainer.innerHTML = '';
            
            const now = new Date();
            const totalDaysRemaining = Math.ceil((targetDate - now) / (1000 * 60 * 60 * 24));

            // מציג צ'יפים של הימים הנותרים
            for (let i = totalDaysRemaining; i >= 1; i--) {
                const chip = document.createElement('div');
                chip.className = 'day-chip';
                chip.textContent = i;
                if (i === 1) chip.classList.add('today');
                gridContainer.appendChild(chip);
            }
        }

        // הפעלה ראשונית ועדכון כל שנייה
        updateCountdown();
        generateDaysGrid();
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>

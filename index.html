<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>טבלת ייאוש - עד מתי?!</title>
    <style>
        :root {
            --primary-gold: #d4af37;
            --accent-glow: rgba(212, 175, 55, 0.4);
            --glass-bg: rgba(255, 255, 255, 0.12);
            --glass-border: rgba(255, 255, 255, 0.25);
            --text-light: #ffffff;
            --text-sub: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-light);
            background: linear-gradient(rgba(15, 23, 42, 0.45), rgba(15, 23, 42, 0.55)),
                        url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat fixed;
        }

        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 35px 25px;
            max-width: 750px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 2.4rem;
            color: var(--text-light);
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .target-date {
            font-size: 1.3rem;
            color: var(--primary-gold);
            font-weight: bold;
            margin-bottom: 25px;
            text-shadow: 0 0 12px var(--accent-glow);
        }

        /* גריד ספירה לאחור (הפוך - מימין לשמאל: שניות -> דקות -> שעות -> ימים) */
        .countdown-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .time-box {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 15px 5px;
            box-shadow: inset 0 0 15px rgba(255,255,255,0.05);
            backdrop-filter: blur(8px);
        }

        .time-value {
            font-size: 2.5rem;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 0 10px var(--accent-glow);
            display: block;
            line-height: 1.1;
        }

        .time-label {
            font-size: 0.9rem;
            color: var(--text-sub);
            margin-top: 5px;
        }

        /* נתוני ימי עבודה וסופי שבוע */
        .extra-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: rgba(15, 23, 42, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 12px 10px;
        }

        .stat-value {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--primary-gold);
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-top: 2px;
        }

        /* משפט מוטיבציה רנדומלי */
        .quote-box {
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 12px;
            padding: 15px 20px;
            font-size: 1.15rem;
            font-weight: 600;
            color: #fff;
            text-shadow: 0 1px 4px rgba(0,0,0,0.6);
            min-height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @media (max-width: 500px) {
            h1 { font-size: 1.8rem; }
            .time-value { font-size: 1.8rem; }
            .countdown-grid { gap: 8px; }
            .extra-stats { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>ספירה לאחור לסיום התפקיד 🕊️</h1>
        <div class="target-date">08/10/2026</div>

        <div class="countdown-grid">
            <div class="time-box">
                <span class="time-value" id="seconds">00</span>
                <span class="time-label">שניות</span>
            </div>
            <div class="time-box">
                <span class="time-value" id="minutes">00</span>
                <span class="time-label">דקות</span>
            </div>
            <div class="time-box">
                <span class="time-value" id="hours">00</span>
                <span class="time-label">שעות</span>
            </div>
            <div class="time-box">
                <span class="time-value" id="days">0</span>
                <span class="time-label">ימים שנותרו</span>
            </div>
        </div>

        <div class="extra-stats">
            <div class="stat-card">
                <div class="stat-value" id="workDays">0</div>
                <div class="stat-label">ימי עבודה נטו (ללא שישי-שבת) 💼</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="weekends">0</div>
                <div class="stat-label">סופי שבוע נותרו ☕</div>
            </div>
        </div>

        <div class="quote-box" id="quoteBox">
            <!-- מולא דינמית -->
        </div>
    </div>

    <script>
        const targetDate = new Date(2026, 9, 8, 8, 0, 0); // 8 באוקטובר 2026

        const quotes = [
            "עוד לא נולד המניאק שיעצור את הזמן 💪✨",
            "קפה של בוקר טעים יותר כשהפז''ם דופק ☕😎",
            "רואים את השקט והכנרת באופק... עוד קצת! 🌊🌴",
            "סבלנות היא לא היכולת לחכות, אלא האיכות שבה נשארים רגועים בזמן שאי אפשר לקצר את הפז''ם 🧘‍♂️",
            "כל שנייה שעוברת זו שנייה שלא תצטרך לעשות שוב! ⏳",
            "מה שבא בקלות בא בקלות, מה שבא בסבלנות שווה את זה 🏝️",
            "מי שמביט בי מאחור לא יודע מי אני... אבל יודע שאני בדרך ללימודים! 🎓",
            "חיוך אחד ביום שומר על הייאוש במרחק בטוח 😉"
        ];

        function setRandomQuote() {
            const randomIndex = Math.floor(Math.random() * quotes.length);
            document.getElementById('quoteBox').textContent = quotes[randomIndex];
        }

        function getWorkingDays(startDate, endDate) {
            let count = 0;
            let curDate = new Date(startDate.getTime());
            curDate.setHours(0,0,0,0);
            const target = new Date(endDate.getTime());
            target.setHours(0,0,0,0);

            while (curDate < target) {
                const dayOfWeek = curDate.getDay();
                if (dayOfWeek !== 5 && dayOfWeek !== 6) { // 5 = שישי, 6 = שבת
                    count++;
                }
                curDate.setDate(curDate.getDate() + 1);
            }
            return count;
        }

        function getRemainingWeekends(startDate, endDate) {
            let count = 0;
            let curDate = new Date(startDate.getTime());
            curDate.setHours(0,0,0,0);
            const target = new Date(endDate.getTime());
            target.setHours(0,0,0,0);

            while (curDate <= target) {
                if (curDate.getDay() === 6) { // שבת
                    count++;
                }
                curDate.setDate(curDate.getDate() + 1);
            }
            return count;
        }

        function updateCountdown() {
            const now = new Date();
            const timeDiff = targetDate - now;

            if (timeDiff <= 0) {
                document.querySelector('.container').innerHTML = `
                    <h1 style="font-size: 3rem;">🎉 זהו, חופשי! 🎉</h1>
                    <p style="font-size: 1.5rem; margin-top: 15px;">ברוכים הבאים לשלווה, לכנרת ולתאילנד! 🏝️🎓</p>
                `;
                return;
            }

            const days = Math.floor(timeDiff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((timeDiff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((timeDiff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((timeDiff % (1000 * 60)) / 1000);

            // ימים שנותרו ללא אפס מוביל
            document.getElementById('days').textContent = String(days);
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');

            document.getElementById('workDays').textContent = getWorkingDays(now, targetDate);
            document.getElementById('weekends').textContent = getRemainingWeekends(now, targetDate);
        }

        setRandomQuote();
        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
